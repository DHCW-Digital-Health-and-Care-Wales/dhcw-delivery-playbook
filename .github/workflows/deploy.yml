# Builds the site with Zensical. On pull requests it builds only (validation,
# with --strict so broken links / warnings fail the check); on push to main it
# also publishes to GitHub Pages.
# In your repo, go to Settings > Pages and set "Source" to "GitHub Actions".

name: Build and deploy site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Zensical reads mkdocs.yml natively and outputs to site/ by default.
      # --strict fails the build on warnings/broken links (the mkdocs --strict
      # equivalent); --clean clears the build cache.
      - run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  accessibility:
    # Automated WCAG 2.2 AA check (axe-core via pa11y-ci). Fails on serious
    # violations. Runs on every PR and push, in parallel with the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: zensical build --clean
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pa11y-ci http-server playwright
      - name: Accessibility checks (WCAG 2.2 AA, fail on serious violations)
        run: |
          set -euxo pipefail
          http-server site -p 8080 --silent &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done

          npx playwright install --with-deps chromium

          cat > .pa11yci.ci.json <<'JSON'
          {
            "defaults": {
              "standard": "WCAG2AA",
              "runners": ["axe"],
              "timeout": 45000,
              "wait": 1500,
              "chromeLaunchConfig": {
                "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--headless=new"]
              }
            },
            "urls": [
              "http://127.0.0.1:8080/"
            ]
          }
          JSON

          npx pa11y-ci --config .pa11yci.ci.json --json > pa11y-results.json || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("pa11y-results.json", "utf8"));
            const findings = Object.entries(report.results || {}).flatMap(([url, issues]) =>
              (issues || []).map((issue) => ({ url, ...issue }))
            );
            // Zensical/Material injects this stock search overlay at runtime on every page.
            // It is not authored in this repo, so keep the check strict everywhere else.
            const THEME_SEARCH_OVERLAY_SELECTOR = "html > body > div:nth-child(11)";
            const THEME_SEARCH_OVERLAY_CONTEXT = "<div style=\"position: fixed; height: 100%; top: 0px; z-index: 4;\"></div>";
            const actionable = findings.filter((issue) =>
              !(
                (issue.code === "color-contrast" && issue.runnerExtras?.needsFurtherReview === true) ||
                (
                  issue.selector === THEME_SEARCH_OVERLAY_SELECTOR &&
                  issue.context === THEME_SEARCH_OVERLAY_CONTEXT &&
                  ["aria-required-attr", "button-name", "scrollable-region-focusable"].includes(issue.code)
                )
              )
            );
            const MAX_ISSUES_TO_DISPLAY = 100;
            if (actionable.length) {
              console.error(`Accessibility check failed with ${actionable.length} actionable issue(s).`);
              for (const issue of actionable.slice(0, MAX_ISSUES_TO_DISPLAY)) {
                console.error(`- [${issue.code}] ${issue.url} :: ${issue.selector}`);
              }
              process.exit(1);
            }
            const filtered = findings.length - actionable.length;
            console.log(`Accessibility checks passed (${filtered} review-only finding(s) ignored, including known stock-theme search overlay issues).`);
          '

  deploy:
    needs: [build, accessibility]
    # Publish only on push to main; pull requests run the build and a11y jobs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
