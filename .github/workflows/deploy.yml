# Builds the site on every push to main and publishes it to GitHub Pages.
# In your repo, go to Settings > Pages and set "Source" to "GitHub Actions".

name: Deploy site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Zensical reads mkdocs.yml natively and outputs to site/ by default.
      # --strict fails the build on warnings/broken links (the mkdocs --strict
      # equivalent); --clean clears the build cache.
      - run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
